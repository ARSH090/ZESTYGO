name: Deploy

# Manual deployment. Production uses a GitHub Environment named "prod" with required reviewers.
# Required per environment (Settings > Environments > Variables):
#   FIREBASE_PROJECT   e.g. zestygo-staging
#   WIF_PROVIDER       workload identity provider resource name
#   DEPLOY_SA          service account email used for deployment
# No service account JSON is stored in GitHub.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate melos && melos bootstrap
      - name: Backend tests gate
        working-directory: functions
        run: npm ci && npm run typecheck && npm test
      - name: Build web portals
        run: |
          (cd apps/restaurant_portal && flutter build web --release --dart-define=ENV=${{ inputs.environment }})
          (cd apps/admin_portal && flutter build web --release --dart-define=ENV=${{ inputs.environment }})
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - run: npm install -g firebase-tools
      - name: Deploy rules, indexes, storage, functions, hosting
        run: firebase deploy --only firestore:rules,firestore:indexes,storage,functions,hosting --project ${{ vars.FIREBASE_PROJECT }} --non-interactive
