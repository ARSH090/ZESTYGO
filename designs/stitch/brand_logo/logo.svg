<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140" fill="none">
  <defs>
    <linearGradient id="zestyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C"/>
      <stop offset="100%" stop-color="#FF6200"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Icon: Glowing Gourmet Pin & Flame/Speed Cloche -->
  <g transform="translate(15, 10)">
    <!-- Ambient back glow -->
    <circle cx="60" cy="60" r="50" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.35"/>
    
    <!-- Outer glass badge -->
    <rect x="10" y="10" width="100" height="100" rx="28" fill="#1C181B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    
    <!-- Food Cloche + Location Pin Geometry -->
    <path d="M60 28 C64 28 67 31 67 35 C67 36 66.5 37 65.5 37.8 C78 40.5 87 50.5 88 63 L32 63 C33 50.5 42 40.5 54.5 37.8 C53.5 37 53 36 53 35 C53 31 56 28 60 28 Z" fill="url(#zestyGrad)"/>
    <!-- Cloche handle top bead -->
    <circle cx="60" cy="33" r="4.5" fill="#FFF9F4"/>
    
    <!-- Platter / Speed Ring Base -->
    <path d="M26 68 C26 66.5 27.5 65 29.5 65 L90.5 65 C92.5 65 94 66.5 94 68 C94 69.5 92.5 71 90.5 71 L29.5 71 C27.5 71 26 69.5 26 68 Z" fill="#FFF9F4" opacity="0.95"/>
    
    <!-- Kinetic delivery pin needle & steam swoosh -->
    <path d="M42 77 C50 86 58 96 60 99 C62 96 70 86 78 77 Z" fill="url(#zestyGrad)"/>
    <circle cx="60" cy="83" r="3.5" fill="#1C181B"/>
  </g>

  <!-- Typography: ZestyGo -->
  <text x="145" y="82" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFF9F4" letter-spacing="-1.5">
    Zesty<tspan fill="url(#zestyGrad)">Go</tspan>
  </text>

  <!-- Tagline badge -->
  <text x="148" y="106" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#BDB4B0" letter-spacing="3.5">
    GOURMET FOOD • LIGHTNING DELIVERY
  </text>
</svg>